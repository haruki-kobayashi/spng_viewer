name: Build Windows executable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-tested.txt
            requirements-build-tested.txt
      - run: python -m pip install -r requirements-build-tested.txt
      - run: python -B -m unittest discover -s tests
      - run: python -B build_exe.py --onefile
      - run: python -B scripts/check_packaged_exe.py
      - uses: actions/upload-artifact@v7
        with:
          name: SPNGViewer-Windows-x64
          path: dist/
          if-no-files-found: error
